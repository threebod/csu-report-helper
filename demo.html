<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>答题助手本地模拟验证</title>
    <style>body{margin:0;background:#f3f7fb;font:15px/1.8 system-ui;color:#25374c}.top{background:#1e9fff;color:white;padding:12px 24px;display:flex;justify-content:space-between}.title{text-align:center;background:white;padding:20px}.workspace{background:white;margin:20px auto;padding:24px;width:75%;min-height:480px}.header{font-weight:bold;display:flex;gap:8px}.dar_options{display:flex;align-items:center;gap:5px;margin:18px 0;cursor:pointer}.dar_optradio,.dar_optcheck{width:15px;height:15px;border:1px solid #aaa;border-radius:50%;display:inline-block}.actradio{background:#1890ff;border-color:#1890ff}.actions{margin-top:100px;display:flex;gap:12px}button{padding:8px 14px;background:white;border:1px solid #aac6df;cursor:pointer}[hidden]{display:none!important}</style>
    <app-report-exame><div class="top"><span>答题助手 · 离线测试</span><span class="personmsg">演示用户 10000</span></div>
    <div class="title">练习演示 · 第一题自动匹配，第二题点击生成 AI 答案</div><main class="workspace"><div id="questions"></div><div class="actions"><button id="prev">上一题</button><button id="next">下一题</button><button id="submit">提交</button><button id="cancel">取消提交（不发送请求）</button></div><div id="message"></div></main></app-report-exame>
    <script>
location.hash='/report-exame?tId=demo&wId=demo&rId=demo';
const store=new Map();
window.GM_getValue=(k,v)=>store.get(k)??v;
window.GM_setValue=(k,v)=>store.set(k,v);
window.GM_registerMenuCommand=()=>{};
store.set('csu-deepseek-key','demo');
window.GM_xmlhttpRequest=req=>setTimeout(()=>req.onload({status:200,responseText:JSON.stringify({choices:[{message:{content:'["B"]'}}]})}),250);
window.fetch=async url=>{
 const questions=[['一小时有多少分钟？',['100','60']],['三角形有几条边？',['四条','三条']]].map(([qText,opts],i)=>({id:'q'+i,qText,qOptionList:opts.map((oText,j)=>({id:i+'-'+j,oText})),answers:[]}));
 const datas=url.endsWith('/paper')?{id:'demo',paper:{reportRecordId:'demo',pText:{paperName:'离线练习',showResult:true,qCateList:[{qCate:1,qCateName:'单选题',questionList:questions}]}}}:{finalScore:100,paperName:'离线练习'};
 return new Response(JSON.stringify({status:200,datas}));
};
</script><script src="report-helper.user.js"></script><script>
    let data, questions=[], current=0;
    function call(kind,body) {
      if (true) return fetch('/classroom/report/multiple/student/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
      return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST','/classroom/report/multiple/student/'+kind);x.setRequestHeader('Content-Type','application/json');x.onload=()=>resolve(JSON.parse(x.responseText));x.onerror=reject;x.send(JSON.stringify(body));});
    }
    function render() {
      const parent=document.querySelector('#questions');parent.replaceChildren();
      questions=data.datas.paper.pText.qCateList.flatMap(c=>c.questionList.map(q=>({...q,type:c.qCate})));
      questions.forEach((q,i)=>{
        const root=document.createElement('div');root.className=q.type===2?'multiple-question':'single-question';root.dataset.qid=q.id;root.hidden=i!==current;
        const header=document.createElement('div');header.className='header';const num=document.createElement('span');num.textContent=(i+1)+'、';header.append(num);
        const title=document.createElement('div');title.className='question-subject';title.textContent=q.qText;header.append(title);root.append(header);
        q.qOptionList.forEach((o,j)=>{const row=document.createElement('div');row.className='dar_options';
          const icon=document.createElement('span');icon.className=(q.type===2?'dar_optcheck':'dar_optradio')+(o.selected?' actradio':'');row.append(icon);
          const letter=document.createElement('span');letter.textContent=String.fromCharCode(65+j)+'. ';row.append(letter);
          const text=document.createElement('div');text.className='dar_optext';text.textContent=o.oText;row.append(text);
          row.onclick=()=>{if(q.type===2)o.selected=!o.selected;else q.qOptionList.forEach(x=>x.selected=x===o);q.answers=q.qOptionList.filter(x=>x.selected).map(x=>x.id);root.querySelectorAll('.dar_options').forEach((n,k)=>n.firstChild.classList.toggle('actradio',!!q.qOptionList[k].selected));};root.append(row);
        });parent.append(root);
      });
    }
    function navigate(step){const q=questions[current];if(q.answers?.length)call('answer',{questionId:q.id,answers:q.answers,reportRecordId:data.datas.paper.reportRecordId});current=(current+step+questions.length)%questions.length;document.querySelectorAll('#questions>div').forEach((r,i)=>r.hidden=i!==current);}
    document.querySelector('#next').onclick=()=>navigate(1);document.querySelector('#prev').onclick=()=>navigate(-1);
    window.gotoQuestion=id=>{const i=questions.findIndex(q=>q.id===id);current=i;document.querySelectorAll('#questions>div').forEach((r,k)=>r.hidden=k!==i);};
    window.sendSubmit=async type=>{const q=questions[current];if(q.answers?.length)await call('answer',{questionId:q.id,answers:q.answers});const response=await call('submit',{id:data.datas.id,submitType:type,isAuto:false});document.querySelector('#message').textContent=response.status===200?'模拟提交成功（演示成绩 100 分）':'提交失败';return response;};
    document.querySelector('#submit').onclick=()=>window.sendSubmit('2');
    call('paper',{}).then(p=>{data=p;render();window.ready=true;});
    </script></html>
